name: Deploy website (Cloudflare Pages)

# Builds the static Astro site and deploys website/dist to Cloudflare Pages with
# `wrangler pages deploy` (Cloudflare's GitHub integration is not used). Needs two
# repo secrets:
#   CLOUDFLARE_API_TOKEN   - token with "Account > Cloudflare Pages > Edit"
#   CLOUDFLARE_ACCOUNT_ID  - the target account's ID
# The Pages project (name from website/wrangler.jsonc: bramble-website) must exist.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "packages/theme/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

# Deploy latest; supersede an in-flight run.
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vault/website build
      - name: Deploy to Cloudflare Pages
        run: pnpm --filter @vault/website exec wrangler pages deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
