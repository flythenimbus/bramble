name: Newsletter

# Adds a published release to the next Buttondown email: releases an hour or less apart share one
# email, sectioned by platform, and at most one goes out every seven days (scripts/newsletter.ts).
# Called by the release workflows when dispatched with `email: true`
# (`pnpm release <target> <version> --email`), and runnable by hand for a release already out.
#
# Needs BUTTONDOWN_API_KEY (email write + sending access) in the `newsletter` environment, and
# DEEPSEEK_API_KEY there to merge the notes across platforms.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to email, e.g. 1.38.0-chromium"
        required: true
        type: string

permissions: {}

jobs:
  send:
    name: Email subscribers
    runs-on: ubuntu-latest
    environment: newsletter
    permissions:
      contents: read
    timeout-minutes: 10
    # One at a time across every release, so two finishing together cannot both pass the weekly check.
    concurrency:
      group: newsletter
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Schedule the email, or join the one already scheduled
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/newsletter.ts "$TAG"
