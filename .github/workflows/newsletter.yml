name: Newsletter

# Emails a published release's notes to Buttondown subscribers, at most once every seven days: a
# second release in the same week is skipped with a notice. Called by the release workflows when
# they are dispatched with `email: true` (`pnpm release <target> <version> --email`), and runnable
# by hand for a release that is already out.
#
# Needs BUTTONDOWN_API_KEY in the `newsletter` environment, from a key with email write and
# sending access.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to email, e.g. 1.38.0-chromium"
        required: true
        type: string

permissions: {}

jobs:
  send:
    name: Email subscribers
    runs-on: ubuntu-latest
    environment: newsletter
    permissions:
      contents: read
    timeout-minutes: 5
    # One at a time across every release, so two finishing together cannot both pass the weekly check.
    concurrency:
      group: newsletter
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Send, unless an email went out in the last 7 days
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/newsletter.ts "$TAG"
