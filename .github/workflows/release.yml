name: Release

# Builds the extension bundle and publishes it as a GitHub Release asset
# whenever a <version>-<platform> tag is pushed (e.g. 1.0.0-chromium). The tag
# splits into <version> and <platform>, naming the asset
# bramble_<platform>_<version>.zip and titling the release
# "<Platform> Extension <version>". Only the Chromium build exists today.
on:
  push:
    tags:
      - "*"

# softprops/action-gh-release creates the release and uploads the asset, both
# of which write to the repo's releases, which the default read-only
# GITHUB_TOKEN can't do.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Same pinned Rust + wasm-pack toolchain as CI: the bundle's `vite build`
      # copies the crypto WASM out of public/wasm/ (gitignored), so it must be
      # freshly built here before bundling, exactly as in ci.yml.
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust deps
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/crypto-wasm

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'

      - name: Install JS deps
        run: bun install

      - name: Build WASM
        run: bun run wasm:build

      # Gate the release on the same lint + tests CI runs on main. Any failure
      # here aborts the job, so no tag ever ships a broken bundle. Placed after
      # the WASM build because the tests exercise the freshly-built crypto bytes.
      - name: Lint
        run: bun run ci:check

      - name: Test
        run: bun run test

      - name: Bundle extension
        run: bun run bundle

      # Tag 1.0.0-chromium -> version 1.0.0, platform chromium. Platform is the
      # last "-"-delimited segment; manifest versions are numeric (no dashes),
      # so the split is unambiguous. `title` upper-cases the first letter for
      # the release name (portable idiom; bash's ${x^} needs bash 4+).
      - name: Derive release metadata
        id: meta
        run: |
          version="${GITHUB_REF_NAME%-*}"
          platform="${GITHUB_REF_NAME##*-}"
          title="$(tr '[:lower:]' '[:upper:]' <<< "${platform:0:1}")${platform:1}"
          cp packages/platform-extension/bramble.zip "bramble_${platform}_${version}.zip"
          echo "asset=bramble_${platform}_${version}.zip" >> "$GITHUB_OUTPUT"
          echo "name=${title} Extension ${version}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.name }}
          files: ${{ steps.meta.outputs.asset }}
