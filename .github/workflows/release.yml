name: Verify release

# These jobs do NOT build or sign; they only confirm a publish carried the real
# signed artifact, so a release can't silently go out without it. Triggered on
# publish (not the tag push), by which point the assets are attached. One job runs
# per platform, keyed off the tag suffix (<version>-chromium / <version>-firefox /
# <version>-android / <version>-desktop).
#
# This fires for a release published from a maintainer's machine (`release --local`).
# It does NOT fire for one published by a release workflow, because a release created
# with GITHUB_TOKEN triggers nothing, which is why each publish job downloads and
# checks its own draft before undrafting it (verifyDraft in scripts/release.ts). Two
# paths to the same guarantee, one per route.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-updater-signature:
    if: endsWith(github.event.release.tag_name, '-desktop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # setup-node reads `packageManager` from package.json and shells out to pnpm to prime a
          # cache, which fails here because this job installs nothing and never sets pnpm up. The
          # verifier is node builtins only, so there is no cache worth priming.
          package-manager-cache: false
      - name: Assert every updater artifact verifies against the app's public key
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # An artifact signed with the wrong key, or not signed at all, produces a release that
          # looks complete and updates nobody: installed apps check the key compiled into THEM.
          #
          # Every platform the updater can apply, not just macOS. This used to fetch
          # `*.app.tar.gz*` alone, so a Windows installer could ship unsigned or signed with the
          # wrong key and the job would still go green off the back of the macOS archive sitting
          # beside it, for the platform most people download.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl

          # One entry per thing an installed app can APPLY. On Windows the download and the
          # updater artifact are the same `-setup.exe`, where macOS and Linux keep the two apart.
          shopt -s nullglob
          verified=0
          for artifact in dl/*.app.tar.gz dl/*.AppImage dl/*-setup.exe; do
            # Checked separately from the loop over `.sig` files, because a missing signature
            # leaves nothing to iterate and would otherwise pass by being invisible.
            if [ ! -f "$artifact.sig" ]; then
              echo "::error::$(basename "$artifact") has no .sig; every installed app would refuse this update"
              exit 1
            fi
            node scripts/verify-updater-signature.mjs "$artifact" "$artifact.sig"
            verified=$((verified + 1))
          done

          # A desktop release with nothing the updater can apply is a release nobody receives.
          [ "$verified" -gt 0 ] || { echo "::error::no updater artifact on release $TAG"; exit 1; }
          echo "ok: $verified updater artifact(s) verified"

  verify-signed-crx:
    if: endsWith(github.event.release.tag_name, '-chromium')
    runs-on: ubuntu-latest
    steps:
      - name: Assert a signed CRX3 is attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          crx="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' | grep -E '\.crx$' | head -1)"
          [ -n "$crx" ] || { echo "::error::no .crx asset on release $TAG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.crx' --dir .
          magic="$(head -c 4 "$crx")"
          [ "$magic" = "Cr24" ] || { echo "::error::$crx is not a CRX3 (magic: $magic)"; exit 1; }
          echo "ok: $crx is a signed CRX3"

  verify-firefox-source:
    if: endsWith(github.event.release.tag_name, '-firefox')
    runs-on: ubuntu-latest
    steps:
      - name: Assert the source .zip + matching SHA256SUMS are attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Firefox ships listed on AMO, which hosts the Mozilla-signed .xpi after review; the
          # GitHub release carries the source bundle + checksum, not a signed artifact.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' --pattern 'SHA256SUMS' --dir .
          zip="$(ls *.zip 2>/dev/null | head -1)"
          [ -n "$zip" ] || { echo "::error::no .zip asset on release $TAG"; exit 1; }
          [ -f SHA256SUMS ] || { echo "::error::no SHA256SUMS on release $TAG"; exit 1; }
          unzip -l "$zip" | grep -q 'manifest.json' \
            || { echo "::error::$zip is not an extension bundle (no manifest.json)"; exit 1; }
          sha256sum -c SHA256SUMS
          echo "ok: $zip matches SHA256SUMS"

  verify-android-apk:
    if: endsWith(github.event.release.tag_name, '-android')
    runs-on: ubuntu-latest
    steps:
      - name: Assert a valid APK + matching SHA256SUMS are attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --pattern 'SHA256SUMS' --dir .
          apk="$(ls *.apk 2>/dev/null | head -1)"
          [ -n "$apk" ] || { echo "::error::no .apk asset on release $TAG"; exit 1; }
          [ -f SHA256SUMS ] || { echo "::error::no SHA256SUMS on release $TAG"; exit 1; }
          # An APK is a ZIP that contains AndroidManifest.xml; the signing cert is what
          # users pin (apksigner verify --print-certs against the published fingerprint).
          unzip -l "$apk" | grep -q AndroidManifest.xml \
            || { echo "::error::$apk is not a valid APK"; exit 1; }
          sha256sum -c SHA256SUMS
          echo "ok: $apk matches SHA256SUMS and is a valid APK"

  verify-apt-repository:
    if: endsWith(github.event.release.tag_name, '-desktop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The signature on the index against the published key, then every package it names: see the
      # script, which apt-release.yml runs too.
      - name: Assert the APT repository verifies and serves every package it names
        run: scripts/verify-apt-repository.sh
