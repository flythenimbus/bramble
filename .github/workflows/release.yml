name: Verify release

# Releases are built, signed, and published from a maintainer's machine by
# `pnpm run release` (the signing key never leaves that machine). This job does
# NOT build or sign; it only confirms that a publish carried a real signed .crx,
# so a release can't silently go out without the verified-upload artifact.
# Triggered on publish (not the tag push), by which point the asset is attached.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-signed-crx:
    runs-on: ubuntu-latest
    steps:
      - name: Assert a signed CRX3 is attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          crx="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' | grep -E '\.crx$' | head -1)"
          [ -n "$crx" ] || { echo "::error::no .crx asset on release $TAG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.crx' --dir .
          magic="$(head -c 4 "$crx")"
          [ "$magic" = "Cr24" ] || { echo "::error::$crx is not a CRX3 (magic: $magic)"; exit 1; }
          echo "ok: $crx is a signed CRX3"
