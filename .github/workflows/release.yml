name: Verify release

# Releases are built, signed, and published from a maintainer's machine by
# `pnpm run release` (the signing key never leaves that machine). These jobs do
# NOT build or sign; they only confirm a publish carried the real signed artifact,
# so a release can't silently go out without it. Triggered on publish (not the tag
# push), by which point the assets are attached. One job runs per platform, keyed
# off the tag suffix (<version>-chromium / <version>-firefox / <version>-android /
# <version>-desktop).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-updater-signature:
    if: endsWith(github.event.release.tag_name, '-desktop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node reads `packageManager` from package.json and shells out to pnpm to prime a
          # cache, which fails here because this job installs nothing and never sets pnpm up. The
          # verifier is node builtins only, so there is no cache worth priming.
          package-manager-cache: false
      - name: Assert the updater archive verifies against the app's public key
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # An archive signed with the wrong key, or not signed at all, produces a release that
          # looks complete and updates nobody: installed apps check the key compiled into THEM.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.app.tar.gz*' --dir dl
          archive="$(ls dl/*.app.tar.gz)"
          [ -f "$archive.sig" ] || { echo "::error::no .sig for $(basename "$archive")"; exit 1; }
          node scripts/verify-updater-signature.mjs "$archive" "$archive.sig"

  verify-signed-crx:
    if: endsWith(github.event.release.tag_name, '-chromium')
    runs-on: ubuntu-latest
    steps:
      - name: Assert a signed CRX3 is attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          crx="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' | grep -E '\.crx$' | head -1)"
          [ -n "$crx" ] || { echo "::error::no .crx asset on release $TAG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.crx' --dir .
          magic="$(head -c 4 "$crx")"
          [ "$magic" = "Cr24" ] || { echo "::error::$crx is not a CRX3 (magic: $magic)"; exit 1; }
          echo "ok: $crx is a signed CRX3"

  verify-firefox-source:
    if: endsWith(github.event.release.tag_name, '-firefox')
    runs-on: ubuntu-latest
    steps:
      - name: Assert the source .zip + matching SHA256SUMS are attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Firefox ships listed on AMO, which hosts the Mozilla-signed .xpi after review; the
          # GitHub release carries the source bundle + checksum, not a signed artifact.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' --pattern 'SHA256SUMS' --dir .
          zip="$(ls *.zip 2>/dev/null | head -1)"
          [ -n "$zip" ] || { echo "::error::no .zip asset on release $TAG"; exit 1; }
          [ -f SHA256SUMS ] || { echo "::error::no SHA256SUMS on release $TAG"; exit 1; }
          unzip -l "$zip" | grep -q 'manifest.json' \
            || { echo "::error::$zip is not an extension bundle (no manifest.json)"; exit 1; }
          sha256sum -c SHA256SUMS
          echo "ok: $zip matches SHA256SUMS"

  verify-android-apk:
    if: endsWith(github.event.release.tag_name, '-android')
    runs-on: ubuntu-latest
    steps:
      - name: Assert a valid APK + matching SHA256SUMS are attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --pattern 'SHA256SUMS' --dir .
          apk="$(ls *.apk 2>/dev/null | head -1)"
          [ -n "$apk" ] || { echo "::error::no .apk asset on release $TAG"; exit 1; }
          [ -f SHA256SUMS ] || { echo "::error::no SHA256SUMS on release $TAG"; exit 1; }
          # An APK is a ZIP that contains AndroidManifest.xml; the signing cert is what
          # users pin (apksigner verify --print-certs against the published fingerprint).
          unzip -l "$apk" | grep -q AndroidManifest.xml \
            || { echo "::error::$apk is not a valid APK"; exit 1; }
          sha256sum -c SHA256SUMS
          echo "ok: $apk matches SHA256SUMS and is a valid APK"

  verify-apt-repository:
    if: endsWith(github.event.release.tag_name, '-desktop')
    runs-on: ubuntu-latest
    steps:
      # What apt trusts is the signature on the index, not the packages: a .deb is verified by its
      # checksum in Packages, which is covered by Release, which is signed. So a repository whose
      # InRelease does not verify against the published key is one that installs nothing, and the
      # failure surfaces to users as "the following signatures were invalid" long after the fact.
      # This runs against the live repository, so it also catches a half-finished upload.
      - name: Assert the APT index verifies against the published key
        run: |
          set -euo pipefail
          curl -fsSL https://apt.bramble.sh/keys.asc | gpg --dearmor > /tmp/bramble.gpg
          curl -fsSL https://apt.bramble.sh/dists/stable/InRelease > /tmp/InRelease
          gpgv --keyring /tmp/bramble.gpg /tmp/InRelease
          echo "ok: InRelease verifies"

      # The index names packages by path and checksum; a pool file that is missing (or was
      # overwritten by a later sync) makes `apt install` fail on a package apt was just told about.
      - name: Assert every package the index names is actually there
        run: |
          set -euo pipefail
          curl -fsSL https://apt.bramble.sh/dists/stable/main/binary-amd64/Packages > /tmp/Packages
          grep '^Filename:' /tmp/Packages | awk '{print $2}' | while read -r path; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -I "https://apt.bramble.sh/$path")"
            [ "$code" = "200" ] || { echo "::error::$path is $code"; exit 1; }
            echo "ok: $path"
          done
