name: Sign Windows installer

# Builds the Windows installer on a GitHub runner and Authenticode-signs it, with Azure Artifact
# Signing or SignPath Foundation: the repository variable WINDOWS_SIGNER picks (`azure`, the default,
# or `signpath`). Exactly one sign job runs and both hand back `bramble-windows-signed`, so nothing
# downstream knows which signed. The release installer is built here rather than cross-compiled on a Mac because the
# signing tool runs only on Windows; see docs/desktop-port.md.
#
# Build, then sign, like the other release workflows: `build` holds no credential. The Azure job
# can obtain an Azure token. Nothing is stored for that: `sign` runs in the `windows-signing` environment, which
# only main may deploy to, and Azure trusts a GitHub OIDC token for exactly that environment of this
# repository (a federated credential). So a branch or a fork can build, never sign. Split also so
# the third-party code a build runs (every crate's build script, every npm install hook) never runs
# beside that token.
#
# What this workflow deliberately does NOT do is produce the updater signature. That key is the
# root of trust for every update the app will ever accept and it never leaves the release's publish
# job, so the .sig is generated afterwards, over the Authenticode-signed bytes. See
# scripts/build-windows.ts.
#
# Driven by `pnpm run build:windows --ci-start`, which dispatches this, and `--ci-collect`, which
# waits for it and signs what comes back. Outside a release: `gh workflow run sign-windows.yml -f
# version=<the version in tauri.conf.json on main>`, plus `-f allow_untrusted=true` against
# SignPath's TEST certificate. SignPath's own constraints are on its job below.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version this run is expected to build, as a guard against a stale ref
        required: true
        type: string
      # Off unless asked for, so it is the TEST run that has to say so and not the release: a release
      # path that forgot a flag would otherwise ship whatever certificate the policy variable points
      # at, which before the production certificate exists is the test one.
      allow_untrusted:
        description: Accept a signature Windows does not trust (SignPath test certificate runs only, never a release)
        required: false
        default: false
        type: boolean

# Nothing by default; each job asks for what it uses.
permissions: {}

jobs:
  build:
    name: Build (unsigned)
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # No cache here either, for the reason spelled out for Rust below: node_modules builds
          # the frontend that goes into this installer.
          package-manager-cache: false

      # Deliberately NOT cached, unlike ci.yml. A Rust cache restores a compiled target/
      # directory, so the signed binary could contain objects that did not come from this run's
      # checkout. ci.yml writes that cache key on every push to main, so restoring it here would
      # widen the trust boundary of the one artifact signed in CI to every workflow that touches it.
      # The cost is a cold build, roughly ten minutes.
      # `cache: false` is what enforces it: the action caches by default.
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # The whole point of the version input. A workflow_dispatch resolves `main` at the moment it
      # is dispatched, so a race against the push of the release commit would silently build the
      # PREVIOUS version, Authenticode-sign it, and hand back an installer that looks correct and
      # carries the wrong version compiled into it.
      - name: Assert the checkout is the version being released
        shell: bash
        run: |
          set -euo pipefail
          conf="$(node -p "require('./clients/desktop/src-tauri/tauri.conf.json').version")"
          if [ "$conf" != "${{ inputs.version }}" ]; then
            echo "::error::checked out $conf but this run is for ${{ inputs.version }}; the release commit is probably not pushed yet"
            exit 1
          fi

      # A throwaway updater key, exactly as the CI build does. The bundler refuses to emit updater
      # artifacts without one, and the .sig it produces here is discarded: it is over the
      # PRE-Authenticode bytes and signed with a key no installed app trusts. build-windows.ts
      # deletes it before writing the real one, and refuses to publish if it is still there.
      - name: Generate a throwaway signing key
        shell: bash
        run: |
          pnpm --filter @vault/platform-desktop exec tauri signer generate -w /tmp/ci.key -p ""
          # Throwaway and trusted by nothing, but a private key in plaintext in a public log reads as a leak.
          echo "::add-mask::$(cat /tmp/ci.key)"
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat /tmp/ci.key)" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      # NSIS only, matching what the cross-compiled build produces, so the artifact a release
      # ships is the same shape whichever route built it.
      - name: Build the installer
        run: pnpm --filter @vault/platform-desktop exec tauri build --bundles nsis

      # Isolated so exactly one file is signed and handed back. The throwaway .sig is left behind on
      # purpose.
      - name: Stage the unsigned installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unsigned
          cp clients/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe unsigned/
          ls -la unsigned/

      - name: Upload the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: bramble-windows-unsigned
          path: unsigned/
          if-no-files-found: error

  sign-azure:
    name: Sign with Azure
    needs: build
    if: ${{ vars.WINDOWS_SIGNER == '' || vars.WINDOWS_SIGNER == 'azure' }}
    runs-on: windows-latest
    # The OIDC subject Azure trusts, and the branch rule that keeps everything but main out of it.
    environment: windows-signing
    permissions:
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Download the unsigned installer
        uses: actions/download-artifact@v8
        with:
          name: bramble-windows-unsigned
          path: signed

      # Pinned to commits: these two hold the signing identity.
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The app holds one role on one certificate profile and nothing on any subscription.
          allow-no-subscriptions: true

      # Timestamped, which is what keeps the signature valid: the certificate itself lives 3 days.
      - name: Sign the installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\signed
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # The failure worth catching is a silently UNSIGNED artifact: it looks identical to a signed
      # one until a user downloads it and SmartScreen says otherwise. Asks Windows whether the
      # signature validates rather than grepping the binary for an issuer name.
      - name: Assert the installer came back signed
        shell: pwsh
        run: |
          $exe = Get-ChildItem signed\*-setup.exe | Select-Object -First 1
          if ($null -eq $exe) { Write-Output "::error::no -setup.exe to check"; exit 1 }

          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($null -eq $sig.SignerCertificate) {
            Write-Output "::error::$($exe.Name) carries no signature; did signing actually run?"
            exit 1
          }

          Write-Output "signer: $($sig.SignerCertificate.Subject)"
          Write-Output "issuer: $($sig.SignerCertificate.Issuer)"
          Write-Output "status: $($sig.Status)"
          if ($null -eq $sig.TimeStamperCertificate) {
            Write-Output "::error::$($exe.Name) is not timestamped, so its signature dies with the 3-day certificate"
            exit 1
          }
          if ($sig.Status -ne 'Valid') {
            Write-Output "::error::the signature does not validate ($($sig.Status))"
            exit 1
          }
          Get-ChildItem signed

      - name: Upload the signed installer
        uses: actions/upload-artifact@v7
        with:
          name: bramble-windows-signed
          path: signed/
          if-no-files-found: error

  # SignPath's free tier for open source verifies where a binary came from: every job leading up to
  # the request must run on a GitHub-hosted runner, with origin metadata from GitHub itself. A
  # production signature waits on a person approving it in SignPath, so a slow approval costs only
  # this job: re-running it resubmits the same installer, no rebuild. The terminal that dispatched
  # the release says when to approve; see release-watch.ts.
  sign-signpath:
    name: Sign with SignPath
    needs: build
    if: ${{ vars.WINDOWS_SIGNER == 'signpath' }}
    runs-on: windows-latest
    # `id-token` is what SignPath's origin verification reads.
    permissions:
      contents: read
      id-token: write
    # Five hours for a person to approve, plus the download and the checks.
    timeout-minutes: 320
    steps:
      # Submitted without waiting, so the link exists before the wait starts. The approval is manual
      # by design: SignPath Foundation requires a person to decide each release may be signed.
      - name: Submit the signing request
        id: submit
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: false

      # A record on the run. GitHub shows notices only once the job ends, so not a live prompt: the
      # live one is release-watch.ts, keyed on this job's name (SIGN_JOB there).
      - name: Announce where to approve it
        shell: bash
        env:
          URL: ${{ steps.submit.outputs.signing-request-web-url }}
        run: |
          echo "::notice title=Approve in SignPath::$URL"
          printf '### Approve the signing request in SignPath\n\n%s\n' "$URL" >> "$GITHUB_STEP_SUMMARY"

      # SignPath's documented REST API, polled rather than the action's own wait, so the step above
      # could run first. A missed window fails here with the build kept: re-run this job.
      - name: Wait for the approval, then download the signed installer
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          REQUEST: ${{ steps.submit.outputs.signing-request-id }}
        run: |
          $api = "https://app.signpath.io/Api/v1/$env:ORGANIZATION/SigningRequests/$env:REQUEST"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $deadline = (Get-Date).AddHours(5)
          $last = ""
          $errors = 0
          while ($true) {
            try {
              $s = Invoke-RestMethod -Uri "$api/Status" -Headers $headers
              $errors = 0
              if ($s.workflowStatus -ne $last) {
                Write-Output "$(Get-Date -Format HH:mm:ss) $($s.workflowStatus)"
                $last = $s.workflowStatus
              }
              if ($s.isFinalStatus) { break }
            } catch {
              # A dropped connection over five hours is ordinary; only a run of them gives up.
              $errors += 1
              if ($errors -ge 10) { Write-Output "::error::SignPath stopped answering: $_"; exit 1 }
            }
            if ((Get-Date) -gt $deadline) {
              Write-Output "::error::nobody approved the signing request within five hours. Re-run this job to submit a fresh one (the build is kept), and deny the stale request in SignPath."
              exit 1
            }
            Start-Sleep -Seconds 30
          }
          if ($s.status -ne 'Completed') {
            Write-Output "::error::the signing request ended $($s.status) ($($s.workflowStatus))"
            exit 1
          }
          Invoke-WebRequest -Uri "$api/SignedArtifact" -Headers $headers -OutFile signed.zip
          Expand-Archive signed.zip -DestinationPath signed

      # The failure worth catching is a silently UNSIGNED artifact: it looks identical to a signed
      # one until a user downloads it and SmartScreen says otherwise.
      #
      # Asks Windows whether a signer is present rather than grepping the binary for an issuer
      # name. The grep this replaces would have failed against SignPath's TEST certificate, which
      # is what a new subscription gets before the production one is issued, reporting "not
      # signed" for a run where signing had worked perfectly.
      #
      # Trust is a hard failure too, unless the run was dispatched with allow_untrusted. A test
      # certificate is self-signed and reports UnknownError here, which is right for a test run and
      # disastrous in a release: users would get an installer Windows calls invalid, worse than an
      # unsigned one. `SIGNPATH_SIGNING_POLICY_SLUG` is the only thing choosing between the two
      # certificates, so this check is what stops a release going out on the wrong one.
      - name: Assert the installer came back signed
        shell: pwsh
        env:
          ALLOW_UNTRUSTED: ${{ inputs.allow_untrusted }}
        run: |
          $exe = Get-ChildItem signed\*-setup.exe | Select-Object -First 1
          if ($null -eq $exe) { Write-Output "::error::no -setup.exe came back from signing"; exit 1 }

          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($null -eq $sig.SignerCertificate) {
            Write-Output "::error::$($exe.Name) carries no signature; did signing actually run?"
            exit 1
          }

          Write-Output "signer: $($sig.SignerCertificate.Subject)"
          Write-Output "issuer: $($sig.SignerCertificate.Issuer)"
          Write-Output "status: $($sig.Status)"
          if ($sig.Status -ne 'Valid') {
            if ($env:ALLOW_UNTRUSTED -ne 'true') {
              Write-Output "::error::the signature does not validate ($($sig.Status)); a release needs one Windows trusts. Is SIGNPATH_SIGNING_POLICY_SLUG still the test policy?"
              exit 1
            }
            Write-Output "::warning::signature is present but does not validate on this runner ($($sig.Status)). Accepted because this run set allow_untrusted (test certificate)."
          }
          Get-ChildItem signed

      - name: Upload the signed installer
        uses: actions/upload-artifact@v7
        with:
          name: bramble-windows-signed
          path: signed/
          if-no-files-found: error
