name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so adding the `e2e` label to a PR re-triggers the workflow and lets the
    # browser suite run (see the e2e job). The other types are the defaults, which listing
    # `labeled` would otherwise replace.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Least privilege: CI only reads the repo, never writes back.
permissions:
  contents: read

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Reads rust-toolchain.toml automatically — single source of truth for
      # the pinned toolchain version, components (rustfmt, clippy), and the
      # wasm32-unknown-unknown target. Replaces `dtolnay/rust-toolchain@stable`,
      # which silently installed whatever the latest stable was instead of
      # honouring the toolchain file → broke CI reproducibility on any local
      # change that depended on a 1.95-specific behaviour.
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # Caches ~/.cargo/registry, ~/.cargo/git, and the named workspaces'
      # target/ directories keyed off Cargo.lock + rustc version. Cold cache
      # cost is one extra step; warm cache shaves several minutes off the
      # WASM build by avoiding recompilation of unchanged deps. The cache key
      # automatically busts when Cargo.lock or the toolchain version changes,
      # so it can't serve a stale build that masks a real regression.
      - name: Cache Rust deps
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core-rust

      # Downloads a precompiled wasm-pack binary (taiki-e/install-action, Node 24
      # runtime) instead of `cargo install`-ing from source (the latter recompiled
      # wasm-pack + every transitive crate each run, ~2 minutes wasted). The pinned
      # version keeps the WASM toolchain reproducible alongside the Rust pin above;
      # bump deliberately, never accidentally.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build WASM
        run: pnpm run wasm:build

      # Behavioural reproducibility gate: exercises the full WASM crypto
      # surface (slot wrap/unwrap, encrypt/decrypt roundtrip, lock/unlock,
      # VEK rotation) against the freshly-built bytes. A toolchain or code
      # change that silently broke a contract fails the build here, before
      # the rest of the suite ever runs.
      - name: Verify WASM
        run: pnpm run wasm:verify

      - name: Typecheck
        run: pnpm run typecheck

      - name: Biome
        run: pnpm run ci:check

      # Extraction currency + translation completeness across every surface
      # (Lingui .po, Android strings.xml, iOS .xcstrings, fastlane metadata).
      # --extract re-runs `lingui extract` first, so a new source string that was
      # never translated surfaces as a missing entry and fails the build.
      - name: i18n check
        run: node scripts/i18n-check.mjs --extract

      - name: Test
        run: pnpm run test

      - name: Build extension
        run: pnpm run build

      # Handed to the e2e job so it doesn't repeat the Rust + WASM build, which is the slow part.
      - name: Upload the built extension
        uses: actions/upload-artifact@v4
        with:
          name: dist-chromium
          path: packages/platform-extension/dist-chromium
          retention-days: 1

  transport-contract-chromium:
    name: Security (document-bound transport, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # This fixture proves the browser's response-channel/navigation primitive only. Production
      # content/background unit tests enforce Bramble's direct request/reply transport on top of it.
      - name: Prove request/reply browser primitive
        run: pnpm run test:transport-race --project=chromium

  transport-contract-firefox:
    name: Security (document-bound transport, Firefox ${{ matrix.firefox-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firefox-version: ["128.0", latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Install Firefox ${{ matrix.firefox-version }}
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: ${{ matrix.firefox-version }}
      - name: Prove request/reply navigation transport
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          FIREFOX_HEADLESS: "0"
        run: xvfb-run -a pnpm run test:transport-race --project=firefox

  # Browser-driven tests: a real Chromium with the extension loaded. Kept out of the `build` job
  # because it is minutes slower and has a different flake profile.
  #
  # NOT run automatically on pull requests. A fork PR can run arbitrary code, and while
  # `pull_request` gives it no secrets and a read-only token, it still spends runner time — so a
  # maintainer opts in per PR by adding the `e2e` label (only users with write access can label).
  # Pushes to main and manual dispatches always run it.
  #
  # Caveat worth knowing: once a PR is labelled, later pushes to it re-run this. Remove the label
  # to stop that.
  e2e:
    name: E2E (extension)
    needs: build
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Download the built extension
        uses: actions/download-artifact@v4
        with:
          name: dist-chromium
          path: packages/platform-extension/dist-chromium

      # The full Chromium build, not just the headless shell: loading an MV3 extension and
      # starting its service worker needs the real one (see e2e/README.md).
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Only the extension suite. `sync` spins up WebRTC between two contexts and `android`
      # needs a physical device; neither belongs on a shared runner.
      - name: E2E
        run: pnpm run test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
