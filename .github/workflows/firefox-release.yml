name: Firefox release

# Builds the Firefox extension, submits it to addons.mozilla.org for listed review, and publishes
# the GitHub release, so a release needs neither a Mac nor a YubiKey. docs/ci-releases.md has the
# trade; the Android workflow is the template and this follows it, with two differences that come
# from Mozilla holding the signing key.
#
# - **What is guarded is the version, not a key.** An AMO upload consumes its version whatever
#   happens next, so the publish job runs a preflight first: the credentials authenticate, they
#   belong to an author of this add-on, and the version is above everything AMO already holds.
# - **The release commit comes before the upload,** where Android commits after signing. The upload
#   cannot be undone and the commit can fail (main moved since the build), so the other order risks a
#   version live on AMO that the repository never recorded. This order's failure is a bump commit
#   with nothing uploaded, which a re-dispatch of the same version finishes.
#
# The publish job installs the workspace's npm packages, because web-ext is how a submission is made,
# so third-party code runs beside the AMO credentials. That is accepted here and would not be for
# Android: AMO keys are regenerated at will and nothing installed depends on them.
#
# `pnpm run release firefox <version>` dispatches this and watches it (`--dry-run` for a dry run,
# `--local` for the old route on a Mac). `dry_run` builds, lints, runs the AMO
# preflight and makes the source archive, then stops: AMO has no dry run of its own, and a real
# submission always spends the version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version to release, e.g. 1.27.0"
        required: true
        type: string
      dry_run:
        description: "Build, lint and preflight against AMO, but commit, submit and publish nothing"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: firefox-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Tags too, so a version that has already shipped is refused before the build.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # No dependency cache in a release build, the same rule Rust follows here: a cache entry
          # is mutable state any run on this repository can write, and these bytes get signed.
          package-manager-cache: false

      # No cache: the WASM in this bundle is what AMO reviewers rebuild and diff against.
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false

      - name: Install wasm-pack
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2
        with:
          tool: wasm-pack@0.13.1

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Gate, bump, build and lint
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release.ts firefox "$VERSION" --runner-build

      - name: Hand off the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firefox-release
          path: release-out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Submit and publish
    needs: build
    runs-on: ubuntu-24.04
    # The approval gate. Its secrets reach this job only after a required reviewer approves it.
    environment: firefox-release
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The commit the build job built, which the release commit must sit directly on top of.
          ref: ${{ github.sha }}
          # The previous firefox tag and the range after it, which the release notes are drawn from.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # pnpm arrives through corepack below, after this step, so setup-node must not go
          # looking for it to prime a cache.
          package-manager-cache: false

      # web-ext, for the submission. Corepack rather than a third-party setup action: it ships with
      # Node, and pins the pnpm that package.json names.
      - name: Install JS deps
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Receive the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firefox-release
          path: release-out/

      - name: Preflight, commit, submit and publish
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          # The source archive reviewers rebuild from is a `git stash create` of the working tree,
          # which makes a commit object and so needs an identity. It is never pushed; the release
          # commit itself is made through GitHub's API and signed by GitHub.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          flags=(--runner-publish)
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          node scripts/release.ts firefox "$VERSION" "${flags[@]}"
