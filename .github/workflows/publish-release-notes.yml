name: Publish release notes

# Publishes a batch of releases' notes once: one Buttondown email to subscribers, at most one a
# week, and the same text as a post on the website's blog, both only after an approval
# (scripts/publish-release-notes.ts has the rules). Runs whenever a release run finishes; only
# runs dispatched with `publish_release_notes: true`
# (`pnpm release <target> <version> --publish-release-notes`) take part, which their "Publish
# release notes" job shows by running rather than being skipped. The last of them to finish
# drafts for all of them into this run's summary; the publish job then waits for an approval in the
# `release-notes` environment. Dispatch by hand to draft again, after a rejected draft or a failed
# publish.
#
# Secrets, each in its own environment so the sending key is only reachable after the approval:
# - release-notes-draft (no reviewer): BUTTONDOWN_API_KEY with read-only email access,
#   DEEPSEEK_API_KEY
# - release-notes (required reviewer): BUTTONDOWN_API_KEY with email write and sending access
# The blog post is committed by the release app (RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY), whose
# push to main deploys the website.

on:
  workflow_run:
    workflows: [Desktop release, Chrome release, Firefox release, Android release]
    types: [completed]
  workflow_dispatch:

permissions: {}

# One at a time, so two releases finishing together cannot both draft. A run waiting for the
# approval holds the line; whatever queues behind it finds the email sent and stops.
concurrency:
  group: publish-release-notes
  cancel-in-progress: false

jobs:
  draft:
    name: Draft
    runs-on: ubuntu-latest
    environment: release-notes-draft
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.draft.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Draft, if this is the last release of the batch
        id: draft
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release-notes.ts draft notes.json
      - name: Hand the draft to the publish job
        if: ${{ steps.draft.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: notes.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish (approve after reading the draft's summary)
    needs: draft
    if: ${{ needs.draft.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    environment: release-notes
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
      # The ruleset on main refuses GITHUB_TOKEN; this app is on its bypass list and holds
      # contents:write and nothing else. docs/ci-releases.md.
      - name: Token that may commit to main
        id: commit-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Post to the blog, then email, unless an email went out since the draft
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BRAMBLE_COMMIT_TOKEN: ${{ steps.commit-token.outputs.token }}
          GH_TOKEN: ${{ steps.commit-token.outputs.token }}
        run: node scripts/publish-release-notes.ts publish notes.json
