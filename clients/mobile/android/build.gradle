// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        // No Google Play APIs: ships as GitHub-released APKs, not via the Play Store.
        // The Capacitor template's com.google.gms:google-services (Firebase/FCM push)
        // classpath was removed deliberately. See docs/mobile-port.md.
        // Kotlin: the app module compiles the uniffi-generated crypto glue (.kt) plus the
        // NativeCrypto plugin (see app/build.gradle: apply plugin: 'kotlin-android').
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
