<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Bramble</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				background: transparent;
				overflow: hidden;
				color-scheme: light dark;
			}
			/* The card's own box, input.tp-input in content/html/corner-styles.ts. */
			input {
				display: block;
				width: 100%;
				height: 100%;
				box-sizing: border-box;
				margin: 0;
				background: rgba(255, 255, 255, 0.06);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 8px;
				color: #fff;
				padding: 10px 12px;
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
				font-size: 13px;
				outline: none;
			}
			input:focus {
				border-color: rgba(255, 255, 255, 0.7);
			}
		</style>
	</head>
	<body>
		<input type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
		<script type="module" src="./corner-field.ts"></script>
	</body>
</html>
