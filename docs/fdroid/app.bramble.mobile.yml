Builds:
  - versionName: 0.9.4
    versionCode: 207094835
    commit: 3655acca8c3445dfc359b81756b991ee2496e237
    subdir: packages/platform-mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils build-essential pkg-config libssl-dev
      - install -d /opt/node
      - curl -fsSL https://nodejs.org/dist/v22.23.1/node-v22.23.1-linux-x64.tar.xz
        | tar -xJ --strip-components=1 -C /opt/node
      - ln -sf /opt/node/bin/node /opt/node/bin/npm /opt/node/bin/npx /usr/local/bin/
      - /opt/node/bin/npm install -g pnpm@10.33.0
      - ln -sf /opt/node/bin/pnpm /usr/local/bin/pnpm
    gradle:
      - yes
    output: build/outputs/apk/release/*.apk
    binary: 
      https://github.com/flythenimbus/bramble/releases/download/%v-android/bramble_android_%v.apk
    prebuild:
      - curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
      - . $HOME/.cargo/env
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - rustup target add x86_64-linux-android i686-linux-android
      - cargo install cargo-ndk@4.1.2 wasm-pack@0.15.0 --locked
      - cd ../../../..
      - pnpm install --frozen-lockfile
      - pnpm run core:build
      - ANDROID_NDK_HOME=$$NDK$$ pnpm run ffi:build:android
      - pnpm --filter @vault/platform-mobile exec cap sync android
    scanignore:
      - node_modules/.pnpm
      - packages/platform-mobile/android/app/src/main/jniLibs
      - packages/platform-mobile/android/app/src/main/assets/public/wasm
    scandelete:
      - packages/core-rust/target
      - packages/platform-mobile/native-build
      - packages/platform-mobile/public/wasm
      - packages/platform-mobile/dist
      - packages/platform-extension/src/fixtures/imports/protonpass.zip
    ndk: 27.1.12297006

