[package]
name = "bramble-desktop"
version = "0.1.0"
description = "Bramble password manager"
# Feeds the Maintainer field of the .deb and .rpm (Tauri falls back to `bundle.publisher` only
# when this is absent, and Debian policy wants a name AND an address). Kept here rather than in
# publisher so the Windows installer's Manufacturer stays a plain name.
authors = ["Bramble <flythenimbus@pm.me>"]
edition = "2021"
publish = false
rust-version = "1.77.2"
# Required once the proxy made this a two-binary package: `tauri dev` shells out to a bare
# `cargo run`, which refuses to guess between them.
default-run = "bramble-desktop"

[lib]
# Tauri's own convention: main.rs is a shim over a lib so a mobile entry point can share it.
name = "bramble_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# macos-private-api is what allows a transparent window, which the spotlight panel needs so
# the native blur behind its webview shows through. It rules out the Mac App Store; Bramble
# ships direct downloads, so that is not a channel being given up. See docs/desktop-port.md.
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# The shared crypto core, linked as an ordinary cargo dependency: no wasm-bindgen and no
# uniffi, unlike the extension and mobile. `native` leaves both binding layers off and
# carries snow/k256 for the sync modules. This is what keeps the VEK in this process
# rather than in the webview. See docs/desktop-port.md.
vault-crypto = { path = "../../core-rust", default-features = false, features = ["native"] }
# The spotlight window's backdrop blur. CSS backdrop-filter cannot do this: it blurs what is
# behind an element within the same page, and the desktop behind a transparent window is not
# in that compositing tree. This inserts the native view (NSVisualEffectView / Acrylic) that
# can. No Linux implementation exists, where it degrades to an opaque panel.
window-vibrancy = "0.8.0"
# The spotlight hotkey. Registering it needs no extra OS permission on macOS; typing INTO
# another app later will (Accessibility), but that is auto-type's problem, not this one.
tauri-plugin-global-shortcut = "2.3.2"
sha2 = "0.10.9"
getrandom = "0.3.4"
base64 = "0.23.1"
# Backup uploads run here, not in the webview: no S3 endpoint or WebDAV server grants CORS to
# `tauri://localhost`, and the credentials live in the OS credential store on this side. Already
# in the tree via the updater plugin; rustls keeps TLS uniform across the three platforms.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "http2",
    "system-proxy",
] }
# One formatted timestamp: SigV4's `YYYYMMDDTHHMMSSZ`. Already in the tree via tauri.
chrono = "0.4"
# Backup credentials are the only plaintext provider secrets in this process, and they are
# handled while the vault may be locked; zeroize keeps freed copies from lingering.
zeroize = { version = "1.8", features = ["derive"] }
# Updating the app in place. Desktop-gated as the plugin's own docs show, so a future mobile
# target does not try to build an updater that has no meaning there.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
# Only for relaunching after an update lands.
tauri-plugin-process = "2.3.1"

[dev-dependencies]
# Each storage test gets its own data dir, so they can run in parallel and clean up after
# themselves. The suite writes real files: the code under test is the filesystem behaviour.
tempfile = "3"

# The pairing private key lives in the OS credential store, not a file. Backends are
# per-platform and their deps do not cross-compile, so each target picks its own: the
# secret-service one pulls dbus, which has no business in a macOS build.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Both Linux backends, chosen at RUNTIME (see secure_store::tier): Secret Service where a
# session bus offers one, else kernel keyutils, which needs no daemon and works headless. Not the
# crate's `linux-native-sync-persistent` combo, which writes to keyutils AND Secret Service and
# fails the write if the latter is absent, so it cannot cover the case this is here for.
keyring = { version = "3.6.3", features = [
    "sync-secret-service",
    "linux-native",
    "crypto-rust",
] }

# The native-messaging host Chrome spawns. Its own bin rather than a mode of the app binary:
# the browser starts it on every launch, so it must not carry Tauri's startup cost, and
# keeping it separate is what lets it stay a byte pump that links almost nothing.
[[bin]]
name = "bramble-proxy"
path = "src/bin/proxy.rs"
