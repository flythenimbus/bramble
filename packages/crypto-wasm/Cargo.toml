[package]
name = "vault-crypto"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# `cdylib` for the WASM build, `rlib` so `cargo test` can build the library
# as a regular Rust crate against the native target and run unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
argon2 = "0.5"
aes-gcm = "0.10"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# --- KDBX4 import spike (de-risking wasm compat) ---
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
chacha20 = "0.9"
flate2 = "1"        # default backend is pure-Rust miniz_oxide -> wasm-clean
quick-xml = "0.37"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
