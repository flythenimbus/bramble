apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "app.bramble.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    // Match the Java 21 source/target the Capacitor template sets in capacitor.build.gradle.
    kotlinOptions {
        jvmTarget = '21'
    }
    defaultConfig {
        applicationId "app.bramble.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode: seconds since 2020-01-01 UTC (mirrors the iOS build number; monotonic, computed at build).
        versionCode(((System.currentTimeMillis() / 1000L) - 1577836800L) as int)
        versionName "0.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is injected at release time by `pnpm run release android` via env vars
    // (the keystore is age+YubiKey encrypted, decrypted to a temp file). Absent for debug/dev/CI,
    // where assembleRelease yields an unsigned APK and assembleDebug is unaffected.
    def releaseKeystore = System.getenv("ANDROID_KEYSTORE_FILE")
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    // Inline autofill suggestions (InlinePresentation slices). AndroidX, not a Play API.
    implementation "androidx.autofill:autofill:$androidxAutofillVersion"
    // JNA backs the uniffi-generated crypto glue; the @aar bundles jnidispatch's native libs.
    implementation "net.java.dev.jna:jna:5.14.0@aar"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// No Google Play APIs (GitHub-released APKs only, no Play Store): the Capacitor
// template's com.google.gms.google-services / Firebase push hook was removed.
