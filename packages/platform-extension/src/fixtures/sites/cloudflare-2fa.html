<!-- dash.cloudflare.com — two-factor sign-in, captured 2026-08.
     A segmented widget with no maxlength=1 anywhere: the boxes declare their
     width with pattern="\d{1}", the FIRST box takes maxlength=6 so an OS code
     autofill can drop the whole code into it, and a visually-hidden aggregate
     input mirrors the value for the form. -->
<form action="/two-factor" method="post" data-testid="two-factor-login-form" class="flex w-full flex-col gap-3">
	<div>
		<div class="">
			<div role="group" class="flex w-full items-center gap-2">
				<input data-length="6" id="base-ui-:rp:" type="text" inputmode="numeric" autocomplete="one-time-code" autocorrect="off" spellcheck="false" enterkeyhint="next" maxlength="6" tabindex="0" pattern="\d{1}" data-testid="two-factor-login-input-2fa-code" class="aspect-square w-full min-w-0 rounded-lg border text-center" value="">
				<input data-length="6" id="base-ui-:rp:-2" type="text" inputmode="numeric" autocomplete="one-time-code" autocorrect="off" spellcheck="false" enterkeyhint="next" tabindex="-1" pattern="\d{1}" class="aspect-square w-full min-w-0 rounded-lg border text-center" value="">
				<input data-length="6" id="base-ui-:rp:-3" type="text" inputmode="numeric" autocomplete="one-time-code" autocorrect="off" spellcheck="false" enterkeyhint="next" tabindex="-1" pattern="\d{1}" class="aspect-square w-full min-w-0 rounded-lg border text-center" value="">
				<input data-length="6" id="base-ui-:rp:-4" type="text" inputmode="numeric" autocomplete="one-time-code" autocorrect="off" spellcheck="false" enterkeyhint="next" tabindex="-1" pattern="\d{1}" class="aspect-square w-full min-w-0 rounded-lg border text-center" value="">
				<input data-length="6" id="base-ui-:rp:-5" type="text" inputmode="numeric" autocomplete="one-time-code" autocorrect="off" spellcheck="false" enterkeyhint="next" tabindex="-1" pattern="\d{1}" class="aspect-square w-full min-w-0 rounded-lg border text-center" value="">
				<input data-length="6" id="base-ui-:rp:-6" type="text" inputmode="numeric" autocomplete="one-time-code" autocorrect="off" spellcheck="false" enterkeyhint="done" tabindex="-1" pattern="\d{1}" class="aspect-square w-full min-w-0 rounded-lg border text-center" value="">
			</div>
			<input type="text" id="base-ui-:rp:-hidden-input" autocomplete="one-time-code" inputmode="numeric" minlength="6" maxlength="6" pattern="\d{6}" aria-hidden="true" tabindex="-1" value="" style="clip-path: inset(50%); overflow: hidden; white-space: nowrap; border: 0px; padding: 0px; width: 1px; height: 1px; margin: -1px; position: fixed; top: 0px; left: 0px;">
		</div>
		<div class="mt-2 min-h-5">
			<p class="text-sm text-kumo-subtle"><span>Enter the code that was generated by your authenticator app.</span></p>
		</div>
	</div>
	<button class="group flex shrink-0 items-center" type="submit" data-testid="two-factor-login-submit-button"><span class="relative flex items-center gap-1.5"><span class="contents"><span>Verify</span></span></span></button>
</form>
