packages:
  - packages/theme
  - packages/core
  - packages/platform-extension
  - packages/platform-mobile
  - packages/platform-desktop
  - website
  - nostr-relay/cf-worker

# Build scripts the cf-worker's wrangler toolchain needs to fetch its platform
# binaries; pnpm blocks unapproved postinstall scripts by default.
onlyBuiltDependencies:
  - esbuild
  - workerd

# Transitive advisory pins, each forced by a dev tool that still ranges onto a
# vulnerable version. None ship to users: all are Node-only build/test tooling.
# Drop one when `pnpm why` shows the parent has moved on and `pnpm audit` stays
# clean.
overrides:
  adm-zip: ^0.6.0 # web-ext > firefox-profile
  shell-quote: ^1.9.0 # web-ext > fx-runner, concurrently
  sharp: ^0.35.0 # wrangler > miniflare, astro
  minimatch@3>brace-expansion: ^2.1.4
  undici: ^7.29.0 # web-ext > addons-linter > cheerio, vitest > jsdom
  xcode>uuid: ^11.1.1 # GHSA-w5hq-g745-h8pq; xcode pins uuid@^7 and has no newer release
